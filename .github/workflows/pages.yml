name: Deploy ArchMap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check types and tests
        run: npm run typecheck && npm test

      - name: Build
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -R site-dist/. _site/
          cp -R dist docs _site/
          cp README.md SPEC.md LICENSE THIRD_PARTY_NOTICES.md _site/

      - name: Verify standalone assets
        run: npm run verify:site && npm run bench:diagrams

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
