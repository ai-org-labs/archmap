name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/packages/lifecycle
          cp -R dist examples docs _site/
          cp -R packages/lifecycle/dist _site/packages/lifecycle/
          cp README.md SPEC.md LICENSE THIRD_PARTY_NOTICES.md _site/
          cp examples/demo.html _site/index.html
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "_site/index.html";
          const html = fs.readFileSync(path, "utf8")
            .replaceAll("../dist/", "./dist/")
            .replaceAll("../packages/lifecycle/dist/", "./packages/lifecycle/dist/");
          fs.writeFileSync(path, html);
          NODE

      - name: Verify standalone assets
        run: |
          test -f _site/dist/archmap.js
          test -f _site/dist/views3d/three-view.js
          test -f _site/packages/lifecycle/dist/index.js
          grep -q '"@archmap/core": "./dist/archmap.js"' _site/index.html
          grep -q '"@archmap/lifecycle": "./packages/lifecycle/dist/index.js"' _site/index.html
          grep -q '"@archmap/core": "../dist/archmap.js"' _site/examples/demo.html
          grep -q '"@archmap/lifecycle": "../packages/lifecycle/dist/index.js"' _site/examples/demo.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
