name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/packages/lifecycle
          mkdir -p _site/examples/screens
          cp -R site-dist/. _site/
          cp examples/screens/* _site/examples/screens/
          cp -R dist docs _site/
          cp -R packages/lifecycle/dist _site/packages/lifecycle/
          cp README.md SPEC.md LICENSE THIRD_PARTY_NOTICES.md _site/

      - name: Verify standalone assets
        run: |
          test -f _site/dist/archmap.js
          test -f _site/dist/views3d/three-view.js
          test -f _site/packages/lifecycle/dist/index.js
          test -f _site/index.html
          test -f _site/playground/index.html
          test -f _site/examples/index.html
          test -f _site/prototype/index.html
          test -f _site/lifecycle/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
